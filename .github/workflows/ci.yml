name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # requirements.txt is now just what the server imports, so CI can install
      # it for real — the heavy ML packages and the private wheel that used to
      # make this impossible are gone.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile all modules
        run: python -m compileall -q .

      # E9 = syntax errors, F = pyflakes (undefined names, unused imports,
      # shadowed variables). Cosmetic whitespace rules are deliberately not
      # gated — they would only add noise.
      - name: Pyflakes
        run: flake8 --select=E9,F --count .

      # Offline suite only: it runs the real app against an in-memory MongoDB,
      # so it needs no server and no credentials. The integration tests in
      # backend/tests skip themselves when no backend is reachable.
      - name: Tests
        run: pytest tests/offline -q
