name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      # Decides whether the app tells someone a place is open. A wrong "open"
      # sends a family to a locked door, which is the problem the app exists to
      # solve — so this one fails the build rather than reporting a number.
      - name: Opening hours
        run: yarn test-hours

      # A photo is the loudest claim on a card. This checks the app can tell a
      # picture of the place from a stock library's idea of the category.
      - name: Photos
        run: yarn test-photo

      # A failed request must reach the reader as a sentence, not as a parser
      # complaint about a body that was never JSON.
      - name: API errors
        run: yarn test-api-errors

      # Reports how much of the app speaks Luxembourgish. Never fails the
      # build — a missing translation is work in progress, not a broken commit.
      - name: Luxembourgish coverage
        if: always()
        run: yarn lb-coverage

  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # requirements.txt is now just what the server imports, so CI can install
      # it for real — the heavy ML packages and the private wheel that used to
      # make this impossible are gone.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile all modules
        run: python -m compileall -q .

      # E9 = syntax errors, F = pyflakes (undefined names, unused imports,
      # shadowed variables). Cosmetic whitespace rules are deliberately not
      # gated — they would only add noise.
      - name: Pyflakes
        run: flake8 --select=E9,F --count .

      # Offline suite only: it runs the real app against an in-memory MongoDB,
      # so it needs no server and no credentials. The integration tests in
      # backend/tests skip themselves when no backend is reachable.
      - name: Tests
        run: pytest tests/offline -q
